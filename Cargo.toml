[workspace]
resolver = "2"
members = ["crates/common", "crates/dns", "crates/server", "crates/agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
repository = "https://github.com/Dwoinn/cotutelle"
authors = ["dwi"]

[workspace.dependencies]
cotutelle-common = { path = "crates/common" }
cotutelle-dns = { path = "crates/dns" }

# Runtime
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Serveur web
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs", "trace", "cors"] }

# Persistance
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

# DNS
hickory-proto = { version = "0.25", default-features = false, features = ["std"] }

# Sécurité
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# Client HTTP et WebSocket (agent, téléchargement des listes)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "cookies"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"

# Archives des listes UT1
tar = "0.4"
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
