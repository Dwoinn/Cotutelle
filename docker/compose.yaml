services:
  cotutelle:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: cotutelle/server:dev
    container_name: cotutelle
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Phase 1 : DNS pour tout le réseau local (D5).
      # - "53:53/udp"
      # - "53:53/tcp"
    volumes:
      - cotutelle-data:/data
    environment:
      RUST_LOG: info

volumes:
  cotutelle-data:
