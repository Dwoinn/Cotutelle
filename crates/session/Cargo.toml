[package]
name = "cotutelle-session"
description = "Assistant de session Cotutelle : temps restant, préavis, sites bloqués et demandes, dans la session de l'enfant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cotutelle-session"
path = "src/main.rs"

[features]
default = ["gtk"]
# Fenêtres natives GTK 4 / libadwaita : écran plein quand l'accès est fermé,
# formulaire de demande. Sans elle, l'assistant garde notifications et icône
# de barre, et ne dépend d'aucune bibliothèque graphique.
gtk = ["dep:gtk4", "dep:libadwaita"]

[dependencies]
cotutelle-common.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
zbus.workspace = true
futures-util.workspace = true
ksni.workspace = true
gtk4 = { workspace = true, optional = true }
libadwaita = { workspace = true, optional = true }
