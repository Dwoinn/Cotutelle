name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # La version et les composants viennent de rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # En-têtes des fenêtres natives de l'assistant de session (feature gtk).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # L'assistant doit aussi se construire sans GTK.
      - run: cargo clippy -p cotutelle-session --no-default-features --all-targets -- -D warnings
      - run: cargo test -p cotutelle-session --no-default-features

  # L'agent et l'assistant de session sous Windows, sans les fenêtres GTK.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cotutelle-agent -p cotutelle-session --no-default-features --all-targets -- -D warnings
      - run: cargo test -p cotutelle-agent -p cotutelle-session --no-default-features

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
